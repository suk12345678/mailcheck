[package]
name = "mailcheck"
version = "0.1.0"
edition = "2021"
description = "Fast, customizable spam filtering CLI for Hotmail / Outlook.com using Microsoft Graph API"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
directories = "5.0"
url = "2.5"

