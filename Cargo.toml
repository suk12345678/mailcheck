[package]
name = "mailcheck"
version = "0.2.0"
edition = "2021"
description = "Fast, customizable spam filtering CLI and GUI for Hotmail / Outlook.com using Microsoft Graph API & IMAP"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mailcheck"
path = "src/main.rs"

[[bin]]
name = "mailcheck-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
directories = "5.0"
url = "2.5"
imap = { version = "2.4.1", default-features = false, features = ["native-tls"] }
native-tls = "0.2.18"
mailparse = "0.17.0"
base64 = "0.23.1"

eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"], optional = true }
egui_extras = { version = "0.36", features = ["default"], optional = true }
