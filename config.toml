# ==============================================================================
# Mailcheck Configuration
# ==============================================================================

[auth]
# Dedicated Mailcheck Azure App Registration for Hotmail / Outlook personal accounts
client_id = "b870d6a8-5d6b-4e94-be55-c4a8c58cdbb4"
# Microsoft OAuth authority: "common" for multitenant / personal accounts
tenant = "common"

[general]
# Action to take when spam is detected:
# "DryRun"     - Print what would be moved, but make no mailbox changes (SAFE DEFAULT)
# "MoveToJunk" - Move detected messages to the "Junk Email" folder
# "Delete"     - Permanently delete detected spam messages
action = "DryRun"

# Check interval in seconds when running in `mailcheck watch` mode
watch_interval_seconds = 60

# Max messages to inspect per scan cycle
max_messages_per_scan = 50

# Only scan unread messages
only_unread = true

# ==============================================================================
# Spam Rules
# ==============================================================================

[rules]
# Safety Whitelist: These domains are NEVER flagged as spam regardless of headers/patterns
whitelisted_domains = [
    "linkedin.com",
    "schwab.com",
    "costco.com",
    "discover.com",
    "farmers.com",
    "interactivebrokers.com",
    "robinhood.com",
    "apple.com",
    "appleid.com",
    "zillow.com",
    "wsj.com",
    "proxymity.io",
    "icloud.com",
    "webstreetproperties.com",
    "amazon.com",
    "news.goggles4u.com"
]

# Blocked Top-Level Domains (TLDs). Any sender address ending in these will trigger.
blocked_tlds = [
    ".xyz",
    ".top",
    ".icu",
    ".buzz",
    ".click",
    ".shop",
    ".cfd",
    ".rest",
    ".quest",
    ".cam",
    ".sbs",
    ".monster",
    ".cyou",
    ".mom",
    ".beauty",
    ".skin",
    ".link"
]

# Blocked exact sender domains
blocked_sender_domains = [
    "beehiiv.com",
    "threadloom.news",
    "privaterelay.appleid.com",
    "pass.maltamarkets.com",
    "digest.datacom.mw",
    "madisonseating.com",
    "itcontractorplus.com",
    "h2-international-newsletter.com",
    "e.eyebuydirect.com",
    "506investorgroup.com",
    "speediance.com",
    "hello.chamberlain.com",
    "av.vc",
    "mail.beehiiv.com",
    "mail.instagram.com",
    "steelseries.com",
    "email.crowdstreet.com",
    "vesta.threadloom.news",
    "realvnc.com",
    "msi.email",
    "henrymayo.com",
    "substack.com",
    "passionflix.com",
    "news.silvur.com",
    "mail.zillow.com",
    "mail.clickup.com",
    "mg-d1.substack.com",
    "augustafinancial.com",
    "info.vercel.com",
    "fatburger.com",
    "email.credible.com",
    "digital.metamail.com",
    "glassdoor.com",
    "mcarthurbs.net"
]

# Words or patterns in Subject that immediately trigger spam
blocked_subject_patterns = [
    "(?i)invoice.*attached",
    "(?i)your order.*confirmed.*#\\d{4,}",
    "(?i)account suspension notice",
    "(?i)urgent notification.*password expired",
    "(?i)bitcoin.*wallet.*transfer"
]

# Header checks: looks into RFC822 internet headers
# (e.g. Authentication-Results, Received-SPF, X-Spam)
[[rules.header_rules]]
name = "SPF Failure"
header = "Authentication-Results"
pattern = "(?i)spf=fail"

[[rules.header_rules]]
name = "DMARC Failure"
header = "Authentication-Results"
pattern = "(?i)dmarc=fail"

# Display Name Spoofing:
# Matches if the display name looks like a reputable brand,
# but the sender's actual email domain is NOT in the allowed list.
[[rules.spoof_rules]]
brand_name = "Geek Squad"
display_pattern = "(?i)geek[- ]?squad"
allowed_domains = ["bestbuy.com", "geeksquad.com"]

[[rules.spoof_rules]]
brand_name = "McAfee"
display_pattern = "(?i)mcafee"
allowed_domains = ["mcafee.com"]

[[rules.spoof_rules]]
brand_name = "Norton"
display_pattern = "(?i)norton"
allowed_domains = ["norton.com", "geneseego.com", "lifelock.com"]

[[rules.spoof_rules]]
brand_name = "PayPal"
display_pattern = "(?i)paypal"
allowed_domains = ["paypal.com", "intl.paypal.com"]

[[rules.spoof_rules]]
brand_name = "Amazon"
display_pattern = "(?i)amazon( customer service| order| support)?"
allowed_domains = ["amazon.com", "amazon.co.uk", "amazon.ca"]

# Recipient anomaly checks
[rules.recipient_checks]
# If true, flags emails where your email is not found in the To: or Cc: lists (mass BCC spam)
flag_if_not_in_to_or_cc = false

